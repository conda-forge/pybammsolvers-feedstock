schema_version: 1

context:
  name: pybammsolvers
  version: "0.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pybammsolvers-${{ version }}.tar.gz
  sha256: dc9fba98fec8ac511cae36b72691c6eb206ec0bf6be18a1e99fe7c531fdd2651
  patches:
    # use conda-forge CasADi
    - 0001-Fix-USE_PYTHON_CASADI.patch
    # find BLAS but still set SUNDIALS_LIBRARIES for pybammsolvers
    - 0002-Fix-Windows-cmake-prefix-path.patch
    # use the host sundials/suitesparse instead of the vendored submodules
    - 0003-Skip-vendored-SUNDIALS-SuiteSparse-under-conda.patch
    # do not force the legacy std::string ABI when linking conda-forge CasADi
    - 0004-Scope-CasADi-CXX11-ABI-detection-to-pip-casadi.patch

build:
  number: 1
  script:
    # it is recommended to use the llvm-openmp package on windows
    # as vcomp14 is not updated by Microsoft anymore
    - if: win
      then: set "CXXFLAGS=%CXXFLAGS% /openmp:llvm"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake
    - make
  host:
    - python
    - scikit-build-core >=0.10
    - casadi
    - pybind11 >=3.0.1
    - pip
    - suitesparse
    # need sundials 7.6+ for openmp support on osx builds
    # remove once there is a migrator for sundials 7.7
- sundials
    - if: not linux
      then: llvm-openmp
      else: libgomp
  run:
    - python
    - casadi
    - numpy >=2.0.0

tests:
  - python:
      imports:
        - pybammsolvers
      pip_check: true

about:
  summary: Python interface for the IDAKLU solver
  homepage: https://github.com/pybamm-team/pybammsolvers
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - prady0t
    - Saransh-cpp
    - agriyakhetarpal
